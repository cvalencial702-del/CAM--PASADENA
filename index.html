function go(v,id){

}
function toast(msg,type){
  var t=document.createElement('div');
  t.className='toast '+(type||'');t.textContent=msg;
  document.getElementById('tc').appendChild(t);
  setTimeout(function(){t.remove();},3200);
}

function handlePDF(inp){
  var f=inp.files[0];if(!f)return;
  if(f.size>5*1024*1024){toast('Archivo supera 5MB','twarn');return;}
  pdfName=f.name;
  var reader=new FileReader();
  reader.onload=function(e){
    pdfData=e.target.result;
    document.getElementById('pdf_preview').innerHTML='<div class="file-attached">📄 <strong>'+esc(pdfName)+'</strong> — adjunto correctamente</div>';
  };
  reader.readAsDataURL(f);
}

/* ══════════════ PIN MODAL ══════════════ */
function reqPin(action,id,id2){
  pinAction=action;pinTarget=id;pinTarget2=id2||'';
  var labels={delCo:'Eliminar empresa',editCo:'Editar empresa',editA:'Editar actividad',delActa:'Eliminar acta',editActa:'Editar acta'};
  var isCam=(action==='delActa'||action==='editActa');
  var ov=document.createElement('div');ov.className='ov';ov.id='pin-modal';
  ov.onclick=function(e){if(e.target===ov)closePinM();};
  var forgotLink=(!isCam)?'<div style="text-align:center;margin-top:10px"><button onclick="showRecovery()" style="background:none;border:none;color:var(--steel);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline">¿Olvidé mi PIN? → Usar PIN de recuperación</button></div>':'';
  ov.innerHTML='<div class="mb"><div class="mh"><div><h2>🔐 Verificación de seguridad</h2><p>'+(labels[action]||action)+(isCam?' · Clave CAM':' · PIN de empresa')+'</p></div><button class="mc" onclick="closePinM()">✕</button></div>'+
  '<div id="pin_section"><div class="fg" style="margin-bottom:6px"><label>'+(isCam?'Clave de administración CAM':'PIN de empresa (4 dígitos)')+'</label>'+
  '<input id="pin_inp" type="password" maxlength="'+(isCam?'10':'4')+'" placeholder="••••" style="letter-spacing:.3em;font-size:20px;text-align:center" onkeydown="if(event.key===\'Enter\')checkPin()"></div>'+forgotLink+'</div>'+
  '<div id="recovery_section" style="display:none"><div style="background:var(--gold-light);border:1px solid #e8d078;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:12px;color:#7d600a">⚠️ <strong>PIN de recuperación</strong> — Ingrese la clave maestra CAM Pasadena para desbloquear sin el PIN original.</div>'+
  '<div class="fg" style="margin-bottom:8px"><label>Clave maestra de recuperación</label><input id="recovery_inp" type="password" placeholder="Clave maestra" style="letter-spacing:.2em;font-size:16px;text-align:center" onkeydown="if(event.key===\'Enter\')checkRecovery()"></div>'+
  '<div style="text-align:center;margin-top:6px"><button onclick="hideRecovery()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline">← Volver al PIN normal</button></div></div>'+
  '<div class="fe"><button class="btn btn-s" onclick="closePinM()">Cancelar</button><button class="btn btn-a" id="pin_verify_btn" onclick="checkPin()">✓ Verificar</button></div></div>';
  document.body.appendChild(ov);
  setTimeout(function(){var el=document.getElementById('pin_inp');if(el)el.focus();},80);
}
function closePinM(){var el=document.getElementById('pin-modal');if(el)el.remove();}
function showRecovery(){
  var ps=document.getElementById('pin_section');
  var rs=document.getElementById('recovery_section');
  var pb=document.getElementById('pin_verify_btn');
  if(ps)ps.style.display='none';
  if(rs)rs.style.display='block';
  if(pb)pb.onclick=function(){checkRecovery();};
  setTimeout(function(){var el=document.getElementById('recovery_inp');if(el)el.focus();},60);
}
function hideRecovery(){
  var ps=document.getElementById('pin_section');
  var rs=document.getElementById('recovery_section');
  var pb=document.getElementById('pin_verify_btn');
  if(ps)ps.style.display='block';
  if(rs)rs.style.display='none';
  if(pb)pb.onclick=function(){checkPin();};
  setTimeout(function(){var el=document.getElementById('pin_inp');if(el)el.focus();},60);
}
function checkRecovery(){
  var inp=document.getElementById('recovery_inp');if(!inp)return;
  if(inp.value!==MASTER){toast('Clave de recuperación incorrecta ⛔');return;}
  /* Recovery accepted — proceed same as correct PIN */
  closePinM();
  executeAction();
}
function executeAction(){
  if(pinAction==='delCo'){
    DB.c=DB.c.filter(function(c){return c.id!==pinTarget;});
    DB.a=DB.a.filter(function(a){return a.cid!==pinTarget;});
    DB.save();toast('Empresa eliminada');go('companies');
  } else if(pinAction==='editCo'){
    openEdit(pinTarget);
  } else if(pinAction==='editA'){
    var actE=DB.a.find(function(a){return a.id===pinTarget;});
    if(actE)openAM(actE.cid,actE.id);
  } else if(pinAction==='delActa'){
    DB.actas=DB.actas.filter(function(a){return a.id!==pinTarget;});
    DB.save();toast('Acta eliminada');go('actas');
  } else if(pinAction==='editActa'){
    ACTA_ID=pinTarget;go('acta-detail');
  }
}
function checkPin(){
  var inp=document.getElementById('pin_inp');if(!inp)return;
  var entered=inp.value;
  var isCam=(pinAction==='delActa'||pinAction==='editActa');
  if(isCam){
    if(entered!=='2026'){toast('Clave incorrecta ⛔');return;}
  } else {
    var lookId=pinTarget2||pinTarget||CID;
    var co=DB.c.find(function(c){return c.id===lookId;});
    if(!co && pinAction==='editA'){var act=DB.a.find(function(a){return a.id===pinTarget;});if(act)co=DB.c.find(function(c){return c.id===act.cid;});}
    if(!co){toast('Empresa no encontrada');closePinM();return;}
    if(entered!==co.pin){toast('PIN incorrecto ⛔ — Si olvidó su PIN, use "¿Olvidé mi PIN?"');return;}
  }
  closePinM();
  executeAction();
}

function verifyMasterForReset(){
  var inp=document.getElementById('rp_master');if(!inp)return;
  if(inp.value!==MASTER){toast('Clave maestra incorrecta ⛔');return;}
  inp.readOnly=true;inp.style.opacity='.5';
  document.getElementById('rp_verify_section').style.display='none';
  document.getElementById('rp_new_section').style.display='block';
  setTimeout(function(){var el=document.getElementById('rp_new');if(el)el.focus();},60);

function saveNewPin(cid){
  var np=document.getElementById('rp_new').value;
  var nc=document.getElementById('rp_confirm').value;
  if(!np||np.length<4){toast('El nuevo PIN debe tener 4 dígitos','twarn');return;}
  if(np!==nc){toast('Los PINs no coinciden','twarn');return;}
  var idx=DB.c.findIndex(function(c){return c.id===cid;});
  if(idx<0){toast('Empresa no encontrada');return;}
  DB.c[idx].pin=np;DB.save();
  closeResetPin();toast('PIN restablecido exitosamente','tok');
}

var editPdfData='',editPdfName='';
function handlePDFEdit(inp){
  var f=inp.files[0];if(!f)return;
  if(f.size>5*1024*1024){toast('Supera 5MB','twarn');return;}
  editPdfName=f.name;
  var reader=new FileReader();
  reader.onload=function(e){
    editPdfData=e.target.result;
    document.getElementById('edit_pdf_preview').innerHTML='<div class="file-attached">📄 <strong>'+esc(editPdfName)+'</strong> — listo para guardar</div>';
  };
  reader.readAsDataURL(f);
}
function closeEdit(){var el=document.getElementById('edit-modal');if(el)el.remove();editPdfData='';editPdfName='';}
function calcTE(){
  var p=parseInt((document.getElementById('e_pp')||{}).value)||0;
  var o=parseInt((document.getElementById('e_po')||{}).value)||0;
  var el=document.getElementById('e_pt');if(el)el.value=p+o;
}
function gvE(id){return (document.getElementById(id)||{}).value||'';}
function saveEdit(cid){
  var idx=DB.c.findIndex(function(c){return c.id===cid;});if(idx<0)return;
  var pp=parseInt(gvE('e_pp'))||0,po=parseInt(gvE('e_po'))||0;
  var co=DB.c[idx];
  /* basic info */
  var nm=gvE('e_name');if(!nm.trim()){toast('El nombre es obligatorio');return;}
  co.name=nm;co.addr=gvE('e_addr');co.legal=gvE('e_legal');
  co.arl=gvE('e_arl');
  /* contacts */
  co.cd=gvE('e_cd');co.cdp=gvE('e_cdp');co.cde=gvE('e_cde');
  co.el=gvE('e_el');co.elp=gvE('e_elp');co.ele=gvE('e_ele');
  co.sl=gvE('e_sl');co.slp=gvE('e_slp');co.sle=gvE('e_sle');
  co.pp=pp;co.po=po;co.pt=pp+po;
  /* dynamic contacts */
  co.contacts=[];
  document.querySelectorAll('#e_clist .ce').forEach(function(r){
    var n=r.querySelector('[name=cn]').value;
    if(n.trim())co.contacts.push({n:n,p:r.querySelector('[name=cp]').value,r:r.querySelector('[name=cr]').value});
  });
  /* brigade */
  co.brigade=[];
  document.querySelectorAll('#e_blist .be').forEach(function(r){
    var n=r.querySelector('[name=bn]').value;
    if(n.trim())co.brigade.push({n:n,r:r.querySelector('[name=br]').value,g:r.querySelector('[name=bg]').value});
  });
  /* recursos físicos */
  co.recursos_fisicos=[];
  document.querySelectorAll('#e_rf_body tr').forEach(function(r){
    var d=r.querySelector('[name=rf_d]').value;
    if(d.trim())co.recursos_fisicos.push({cant:r.querySelector('[name=rf_c]').value,desc:d,ubic:r.querySelector('[name=rf_u]').value});
  });
  /* recursos humanos */
  co.recursos_humanos=[];
  document.querySelectorAll('#e_rh_body tr').forEach(function(r){
    var d=r.querySelector('[name=rh_d]').value;
    if(d.trim())co.recursos_humanos.push({cant:r.querySelector('[name=rh_c]').value,caract:d});
  });
  /* misc */
  co.emerg=gvE('e_em');co.apoyo_mutuo=gvE('e_apf');co.apoyo_humano=gvE('e_aph');
  /* PDF */
  if(editPdfData){co.acuerdo_pdf=editPdfData;co.acuerdo_nombre=editPdfName;}
  /* PIN (optional) */
  var np=gvE('e_pin_new'),nc=gvE('e_pin_conf');
  if(np){
    if(np.length<4){toast('El nuevo PIN debe tener 4 dígitos','twarn');return;}
    if(np!==nc){toast('Los PINs no coinciden','twarn');return;}
    co.pin=np;
  }
  DB.save();closeEdit();editPdfData='';editPdfName='';
  toast('Empresa actualizada correctamente','tok');render();
}

function setMod(m){MOD=m;document.getElementById('mod_p').className='mod-btn'+(m==='Presencial'?' act':'');document.getElementById('mod_v').className='mod-btn'+(m==='Virtual'?' act':'');}
function addAsi(){var coOpts=DB.c.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('');var tr=document.createElement('tr');tr.innerHTML=rowAsi(coOpts);document.getElementById('asi_body').appendChild(tr);}

function getActaData(){
  var emps=[];document.querySelectorAll('[name=emp_chk]:checked').forEach(function(cb){emps.push(cb.value);});
  var asis=[];document.querySelectorAll('#asi_body tr').forEach(function(r){asis.push({n:r.querySelector('[name=as_n]').value,cargo:r.querySelector('[name=as_c]').value,eid:r.querySelector('[name=as_e]').value});});
  var ag=[];document.querySelectorAll('#ag_body tr').forEach(function(r){ag.push({tema:r.querySelector('[name=ag_t]').value,des:r.querySelector('[name=ag_d]').value});});
  var comp=[];document.querySelectorAll('#comp_body tr').forEach(function(r){comp.push({desc:r.querySelector('[name=co_d]').value,resp:r.querySelector('[name=co_r]').value,fecha:r.querySelector('[name=co_f]').value,st:r.querySelector('[name=co_s]').value});});
  return {tipo:gv('ac_tipo'),modalidad:MOD,fecha:gv('ac_fecha'),hi:gv('ac_hi'),hf:gv('ac_hf'),lugar:gv('ac_lugar'),objetivo:gv('ac_obj'),empresas:emps,asistentes:asis,agenda:ag,compromisos:comp};
}
function saveActa(){
  var d=getActaData();
  if(!d.tipo){toast('Seleccione el tipo','twarn');return;}
  if(!d.fecha){toast('La fecha es obligatoria','twarn');return;}
  d.id='ac'+Date.now();d.consec=nextConsec();
  DB.actas.push(d);DB.save();toast(d.consec+' guardada','tok');go('actas');
}
function prevActa(){openActaPDF(getActaData());}

/* Known Bogotá address geocoding table — returns approx lat/lng */
function geocodeAddr(addr) {
  /* Try to return a rough Bogotá coordinate based on address keywords */
  var zones = [
    {kw:['pasadena','calle 102','cll 102','cl 102'], lat:4.6970, lng:-74.0560},
    {kw:['cra 15','carrera 15','kr 15'], lat:4.6850, lng:-74.0460},
    {kw:['calle 80','cl 80','cll 80','av. calle 80'], lat:4.6980, lng:-74.1040},
    {kw:['calle 127','cl 127','cll 127'], lat:4.7020, lng:-74.0480},
    {kw:['suba','calle 145','cl 145'], lat:4.7420, lng:-74.0920},
    {kw:['chapinero','cra 9','carrera 9'], lat:4.6490, lng:-74.0580},
    {kw:['usaquen','calle 116','cl 116'], lat:4.6950, lng:-74.0310},
    {kw:['fontibon','av. calle 13','zona industrial'], lat:4.6610, lng:-74.1330},
    {kw:['kennedy','calle 38 sur','americas'], lat:4.6280, lng:-74.1500},
    {kw:['bosa','soacha'], lat:4.5980, lng:-74.1870},
    {kw:['engativa','av 68','avenida 68'], lat:4.7020, lng:-74.1040},
    {kw:['teusaquillo','palermo','quinta paredes'], lat:4.6430, lng:-74.0820},
    {kw:['santa barbara','unicentro','calle 127'], lat:4.7010, lng:-74.0450},
    {kw:['restrepo','calle 17 sur'], lat:4.5880, lng:-74.1020},
    {kw:['centro','candelaria','bolivar'], lat:4.5981, lng:-74.0762},
    {kw:['modelia','normandia','avenida 40'], lat:4.6810, lng:-74.1160},
    {kw:['chico','rosales','cra 7','carrera 7'], lat:4.6590, lng:-74.0530},
    {kw:['alhambra','pontevedra','calle 127'], lat:4.7010, lng:-74.0590},
    {kw:['tabora','calle 80','bodega'], lat:4.6880, lng:-74.1020},
  ];
  var a = addr.toLowerCase();
  for(var i=0;i<zones.length;i++){
    var z=zones[i];
    for(var j=0;j<z.kw.length;j++){
      if(a.indexOf(z.kw[j])>=0){
        /* add tiny random offset so markers dont overlap exactly */
        return [z.lat + (Math.random()-0.5)*0.004, z.lng + (Math.random()-0.5)*0.004];
      }
    }
  }
  /* default: Bogotá center with random offset */
  return [BOGOTA[0]+(Math.random()-0.5)*0.02, BOGOTA[1]+(Math.random()-0.5)*0.02];
}

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
      maxZoom:19

    var camIcon=L.divIcon({className:'',html:'<div style="background:#0d1b30;color:#fff;border:3px solid #c0392b;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.4)">🏛</div>',iconSize:[36,36],iconAnchor:[18,18]});
    L.marker([4.6970,-74.0560],{icon:camIcon}).addTo(MAP_INSTANCE)
      .bindPopup('<div style="font-family:IBM Plex Sans,sans-serif"><div style="font-weight:700;color:#0d1b30;font-size:13px;margin-bottom:3px">📍 CAM Pasadena</div><div style="font-size:12px;color:#6b7a99">Comité de Ayuda Mutua<br>Sector Pasadena · Bogotá</div></div>');

    var colors=['#c0392b','#2980b9','#1a7a4a','#d4ac0d','#8e44ad','#e67e22','#16a085','#2c3e50'];

      var col=colors[i%colors.length];
      var n=DB.a.filter(function(a){return a.cid===c.id;}).length;

        html:'<div style="background:'+col+';color:#fff;border:3px solid #fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 10px rgba(0,0,0,.35);font-weight:700">'+c.name.charAt(0)+'</div>',

        '</div>';
      var marker=L.marker(coords,{icon:icon}).addTo(MAP_INSTANCE).bindPopup(popup,{maxWidth:260});
      MAP_MARKERS[c.id]=marker;

      {name:'🏥 Clínica Shaio',coords:[4.7028,-74.0840],col:'#e74c3c'},
      {name:'🏥 Clínica Reina Sofía',coords:[4.7095,-74.0490],col:'#e74c3c'},
      {name:'🚒 Bomberos B-12 Suba',coords:[4.7400,-74.0900],col:'#e67e22'},

function flyToCompany(cid){
  var co=DB.c.find(function(c){return c.id===cid;});

}

function resetMapView(){
  if(MAP_INSTANCE)MAP_INSTANCE.flyTo(BOGOTA,12,{duration:1});
}

function closePop(){
  if(MAP_INSTANCE)MAP_INSTANCE.closePopup();
}
